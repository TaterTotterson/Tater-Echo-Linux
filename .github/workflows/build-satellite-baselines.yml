name: Build satellite baseline mirror

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Validate provenance and USB readiness records
        run: |
          python3 tools/fetch_baselines.py --check
          python3 tools/audit_usb_ethernet.py
      - name: Fetch and verify byte-identical baselines
        run: python3 tools/fetch_baselines.py --output dist
      - name: Recheck release checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tater-echo-satellite-baselines-v1
          path: dist/
          if-no-files-found: error
