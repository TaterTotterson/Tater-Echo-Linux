name: Build Athena Ethernet kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev xz-utils

      - name: Build Athena kernel and boot image
        shell: bash
        env:
          WORK: /tmp/tater-athena-kbuild
          OUT: ${{ github.workspace }}/dist/athena
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -euo pipefail
          bash platforms/show/tools/linux/athena/kernel/build.sh
          printf '%s\n' \
            'source=https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.56.tar.xz' \
            'source_sha256=4633bbda2ab95eaf2a7af4041236451d6759c72e6946265531af4b3aacefbf89' \
            "tater_linux_commit=$GITHUB_SHA" \
            > dist/athena/SOURCE
          (cd dist/athena && sha256sum SOURCE >> SHA256SUMS)
          cat dist/athena/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tater-echo-athena-ethernet-kernel-${{ github.sha }}
          path: dist/athena/
          if-no-files-found: error
